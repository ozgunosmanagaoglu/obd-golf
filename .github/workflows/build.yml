name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test OBD logic
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk golf-obd.apk

      - uses: actions/upload-artifact@v4
        with:
          name: golf-obd-apk
          path: golf-obd.apk

      # Keeps one always-current download link: Releases > "latest".
      # Not a prerelease: GitHub's /releases/latest link skips prereleases.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest golf-obd.apk \
            --title "Golf OBD (build ${{ github.run_number }})" \
            --notes "Otomatik derleme: ${{ github.sha }}" \
            --latest
