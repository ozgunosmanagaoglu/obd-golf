<!doctype html>
<html lang="tr">
<head>

<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>Golf 3D Garaj</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:Sora;font-weight:200;src:url(fonts/sora_extralight.ttf)}
@font-face{font-family:Sora;font-weight:300 400;src:url(fonts/sora_light.ttf)}
@font-face{font-family:Sora;font-weight:600;src:url(fonts/sora_semibold.ttf)}
</style>
<style>
  /* Layout: full-screen 3D garage, title top-left, controls in a bottom dock. Single dark look on purpose. */
  :root {
    --bg: #050608;
    --fg: #f4f5f7;
    --muted: #9a9ea6;
    --glass: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.10);
    --red: #e3001b;
    --font: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .top {
    position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.28em; color: var(--muted); }
  .name { font-size: clamp(20px, 5.5vw, 26px); font-weight: 300; letter-spacing: -0.01em; margin-top: 2px; }
  .name b { font-weight: 600; }
  .hud { text-align: right; }
  .rpm { font-size: 40px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .rpm.hot { color: #ff4d5e; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 640px; }
  button {
    font: 400 13px var(--font); letter-spacing: 0.08em; color: var(--fg);
    min-height: 44px; padding: 0 16px; border-radius: 22px; cursor: pointer;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s;
  }
  button[aria-pressed="true"] { background: rgba(227,0,27,0.22); border-color: rgba(227,0,27,0.7); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  #gas { min-width: 180px; min-height: 52px; border-radius: 26px; font-weight: 600; letter-spacing: 0.22em; background: linear-gradient(90deg, var(--red) var(--p, 0%), var(--glass) var(--p, 0%)); touch-action: none; }
  #gas[hidden] { display: none !important; }
  .credit { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); font-size: 9px; color: #6f747c; pointer-events: none; }
  .tag {
    position: fixed; pointer-events: none; transform: translate(-50%, -120%);
    font-size: 11px; letter-spacing: 0.16em; padding: 6px 10px; border-radius: 12px;
    background: rgba(5,6,8,0.75); border: 1px solid var(--line); white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  .tag.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<canvas id="scene" aria-label="Döndürülebilir 3D gri Golf, garajda"></canvas>

<div class="top">
  <div>
    <div class="eyebrow">GARAJ</div>
    <div class="name">Golf <b>VI</b></div>
    <div class="hint" style="margin-top:2px">1.4 TSI · DSG · 122 HP</div>
  </div>
  <div class="hud">
    <div class="rpm" id="rpm">0</div>
    <div class="eyebrow" style="margin-top:4px">DEVİR / DK</div>
    <div class="hint" id="hint">Model yükleniyor…</div>
  </div>
</div>

<div class="tag" id="tagTurbo">TURBO · <span id="boost">0.0</span> bar</div>
<div class="tag" id="tagEngine">EA111 · 4 SİLİNDİR</div>

<div class="credit">3D model: “Volkswagen Golf 6” · Nieve5677 · CC BY 4.0</div>
<div class="dock">
  <button id="gas" type="button" hidden>BASILI TUT · GAZ</button>
  <div class="row">
    <button id="bHood" type="button" aria-pressed="false">Kaput</button>
    <button id="bDoors" type="button" aria-pressed="false">Kapılar</button>
    <button id="bHatch" type="button" aria-pressed="false">Bagaj</button>
    <button id="bSpin" type="button" aria-pressed="true">Döndür</button>
    <button id="bEngine" type="button" aria-pressed="false">Motoru çalıştır</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "./three.module.min.js",
  "three/addons/": "./addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL = 'golf6/golf6.json';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);
scene.fog = new THREE.Fog(0x050608, 9, 22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
camera.position.set(5.2, 2.1, 5.4);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.6;
controls.maxDistance = 10;
controls.maxPolarAngle = 1.48;
controls.minPolarAngle = 0.35;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ---------- Garage ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 96), new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 0.32, metalness: 0.4 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const turntable = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.05, 0.06, 96), new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.25, metalness: 0.6 }));
turntable.position.y = 0.03; turntable.receiveShadow = true; scene.add(turntable);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xe3001b });
const ring = new THREE.Mesh(new THREE.TorusGeometry(3.04, 0.012, 8, 160), ringMat);
ring.rotation.x = Math.PI / 2; ring.position.y = 0.062; scene.add(ring);
// Ceiling light strips.
for (let i = -2; i <= 2; i++) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 6), new THREE.MeshBasicMaterial({ color: 0xf2f4f8 }));
  strip.position.set(i * 1.3, 4.2, 0); scene.add(strip);
}
// Back wall with red neon line.
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), new THREE.MeshStandardMaterial({ color: 0x0a0b0e, roughness: 0.9 }));
wall.position.set(0, 4, -8); scene.add(wall);
const neon = new THREE.Mesh(new THREE.BoxGeometry(14, 0.04, 0.04), new THREE.MeshBasicMaterial({ color: 0xe3001b }));
neon.position.set(0, 1.4, -7.9); scene.add(neon);

scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x0a0a0c, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 7, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
key.shadow.bias = -0.0004;
scene.add(key);
const redFill = new THREE.PointLight(0xe3001b, 6, 9, 2); redFill.position.set(-3.5, 1.2, -3); scene.add(redFill);
const rim = new THREE.PointLight(0x8fb4ff, 3, 10, 2); rim.position.set(4, 1.5, -4); scene.add(rim);

// ---------- Materials ----------
const paint = new THREE.MeshPhysicalMaterial({ color: 0x6b7077, metalness: 0.7, roughness: 0.33, clearcoat: 1, clearcoatRoughness: 0.05 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x10151b, metalness: 0.1, roughness: 0.04, transparent: true, opacity: 0.55 });
const black = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.55 });
const trim = new THREE.MeshStandardMaterial({ color: 0x18191c, roughness: 0.6 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd9dde2, metalness: 1, roughness: 0.15 });
const engineMetal = new THREE.MeshStandardMaterial({ color: 0x3a3d43, metalness: 0.7, roughness: 0.45 });
const camCover = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, metalness: 0.6, roughness: 0.35 });
const redCoil = new THREE.MeshStandardMaterial({ color: 0xc4121f, roughness: 0.4 });
const turboMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 0.95, roughness: 0.3, emissive: new THREE.Color(0xff4a10), emissiveIntensity: 0 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xe9eef5, emissive: 0xdfe8ff, emissiveIntensity: 0.6, roughness: 0.05, transparent: true, opacity: 0.6 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x7a0d18, emissive: 0xff1a2e, emissiveIntensity: 0.4, roughness: 0.2, transparent: true, opacity: 0.85 });

const car = new THREE.Group();
scene.add(car);
const clickable = [];
const parts = {};
const wheels = [];

// ---------- The Golf: "Volkswagen Golf 6" by Nieve5677, CC BY 4.0 ----------
// The model comes as one piece per material, so doors, hood and hatch are cut out here
// by where each triangle sits. Numbers are in the model's own coordinates (metres):
// x across the car (centre 1.345), y up, z along it (front bumper -0.1, rear -4.57).
const CX = 1.345, CZ = -2.335;
const DROP = ['Object_2', 'Object_3', 'Object_4', 'Object_6']; // stray bits far from the car
// Each opening part is a box made of planes [a, b, c, d]: a point is inside when a*x + b*y + c*z + d > 0.
// Triangles that cross a seam are cut along it, so the panel gaps come out straight.
const L = (side) => side === 'L' ? 1 : -1;
function doorPlanes(side, front) {
  const s = L(side), common = [[s, 0, 0, -s * CX - 0.5], [0, 1, 0, -0.3], [0, -1, 0, 1.47]];
  return front
    ? [...common, [0, 0, -1, -1.5], [0, 0, 1, 2.64], [0, -1, -0.8727, -0.344]]  // last one: the A-pillar slope
    : [...common, [0, 0, -1, -2.64], [0, 0.6538, 1, 3.0173], [0, 0, 1, 3.74]];   // slanted rear edge
}
const REGIONS = [
  { name: 'hood', planes: [[0, 0, 1, 1.36], [0, 1, 0, -0.84], [1, 0, 0, -(CX - 0.76)], [-1, 0, 0, CX + 0.76]],
    keep: (mat, ny) => (mat === 'body' || mat === '1_body') && ny > 0.35 },
  { name: 'hatch', planes: [[0, 0, -1, -3.93], [0, 1, 0, -0.56]], keep: () => true },
  ...['L', 'R'].flatMap(side => [true, false].map(front => ({
    name: 'door' + side + (front ? 'F' : 'R'), planes: doorPlanes(side, front),
    keep: (mat, ny, y) => mat !== 'Gar_alu1' && !(mat === 'Gar_gum1' && y < 0.7),
  }))),
];
const STRIDE = 6; // x y z nx ny nz
function clip(poly, [a, b, c, d]) {
  const ins = [], outs = [], n = poly.length;
  for (let i = 0; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n];
    const dp = a * p[0] + b * p[1] + c * p[2] + d, dq = a * q[0] + b * q[1] + c * q[2] + d;
    (dp >= 0 ? ins : outs).push(p);
    if ((dp >= 0) !== (dq >= 0)) {
      const t = dp / (dp - dq), v = new Array(STRIDE);
      for (let k = 0; k < STRIDE; k++) v[k] = p[k] + (q[k] - p[k]) * t;
      ins.push(v); outs.push(v);
    }
  }
  return [ins, outs];
}
function splitTriangle(tri, mat, out) {
  const [a, b, c] = tri;
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const fny = Math.abs(ny) / (Math.hypot(nx, ny, nz) || 1), cy = (a[1] + b[1] + c[1]) / 3;
  let rest = [tri];
  for (const r of REGIONS) {
    if (!r.keep(mat, fny, cy)) continue;
    const next = [];
    for (let poly of rest) {
      for (const pl of r.planes) {
        const [i, o] = clip(poly, pl);
        if (o.length >= 3) next.push(o);
        poly = i;
        if (poly.length < 3) break;
      }
      if (poly.length >= 3) (out[r.name] ||= []).push(poly);
    }
    rest = next;
  }
  for (const poly of rest) (out.body ||= []).push(poly);
}
function polysToGeometry(polys) {
  const pos = [], nor = [];
  for (const poly of polys) for (let i = 1; i < poly.length - 1; i++) for (const v of [poly[0], poly[i], poly[i + 1]]) {
    pos.push(v[0], v[1], v[2]); const l = Math.hypot(v[3], v[4], v[5]) || 1; nor.push(v[3] / l, v[4] / l, v[5] / l);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  return g;
}
const MAT_MAP = { body: paint, '1_body': paint, Gar_skl1: glass, headlights: headMat, taillights: tailMat, Color_A01: tailMat, Color_A16: tailMat };
const HINGES = {
  hood:   { pivot: [CX, 1.06, -1.33], axis: 'x', sign: -1, max: 1.0 },
  hatch:  { pivot: [CX, 1.5, -3.93], axis: 'x', sign: 1, max: 1.2 },
  doorLF: { pivot: [CX + 0.88, 0.8, -1.5], axis: 'y', sign: -1, max: 1.05 },
  doorRF: { pivot: [CX - 0.88, 0.8, -1.5], axis: 'y', sign: 1, max: 1.05 },
  doorLR: { pivot: [CX + 0.86, 0.8, -2.64], axis: 'y', sign: -1, max: 1.05 },
  doorRR: { pivot: [CX - 0.86, 0.8, -2.64], axis: 'y', sign: 1, max: 1.05 },
};
const model = new THREE.Group(); model.position.set(-CX, 0, -CZ); car.add(model);
const groups = { body: model };
for (const [name, h] of Object.entries(HINGES)) {
  const pivot = new THREE.Group(); pivot.position.set(...h.pivot); model.add(pivot);
  const inner = new THREE.Group(); inner.position.set(-h.pivot[0], -h.pivot[1], -h.pivot[2]); pivot.add(inner);
  groups[name] = inner;
  parts[name] = { g: pivot, axis: h.axis, sign: h.sign, max: h.max, open: false, t: 0 };
}

const loadingEl = document.getElementById('hint');
new GLTFLoader().load(MODEL_URL, (gltf) => {
  gltf.scene.updateMatrixWorld(true);
  const meshes = [];
  gltf.scene.traverse(o => { if (o.isMesh && !DROP.includes(o.name)) meshes.push(o); });
  for (const m of meshes) {
    const geo = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()).applyMatrix4(m.matrixWorld);
    if (!geo.attributes.normal) geo.computeVertexNormals();
    const P = geo.attributes.position, N = geo.attributes.normal;
    const vert = (i) => [P.getX(i), P.getY(i), P.getZ(i), N.getX(i), N.getY(i), N.getZ(i)];
    const srcMat = m.material, matName = srcMat.name;
    const buckets = {};
    for (let i = 0; i < P.count; i += 3) splitTriangle([vert(i), vert(i + 1), vert(i + 2)], matName, buckets);
    const mat = MAT_MAP[matName] || srcMat;
    if (!MAT_MAP[matName]) { mat.metalness = Math.min(mat.metalness ?? 0, 0.6); }
    for (const [p, polys] of Object.entries(buckets)) {
      const mesh = new THREE.Mesh(polysToGeometry(polys), mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      groups[p].add(mesh);
      if (p !== 'body') { mesh.userData.part = p; clickable.push(mesh); }
    }
  }
  loadingEl.textContent = 'Sürükle: döndür · Parçaya dokun: aç / kapat';
}, undefined, () => { loadingEl.textContent = 'Model yüklenemedi'; });

// ---------- Engine bay (our own stand-in for the 1.4 TSI, the model has none) ----------
// Normalised car coordinates: front is +z, bay centre about z = 1.5.
const engine = new THREE.Group(); engine.position.set(0, 0, 1.5); car.add(engine);
const block = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.24, 0.4), engineMetal); block.position.set(-0.05, 0.66, 0); block.castShadow = true; engine.add(block);
const cover = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.34), camCover); cover.position.set(-0.05, 0.81, 0); engine.add(cover);
for (let i = 0; i < 4; i++) {
  const coil = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.06, 12), redCoil); coil.position.set(-0.29 + i * 0.16, 0.86, 0); engine.add(coil);
}
const radiator = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.24, 0.05), black); radiator.position.set(0, 0.6, 0.4); engine.add(radiator);
const battery = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.17, 0.2), black); battery.position.set(-0.55, 0.62, -0.2); engine.add(battery);
const reservoir = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.12), new THREE.MeshStandardMaterial({ color: 0x2f6fbf, roughness: 0.3, transparent: true, opacity: 0.85 }));
reservoir.position.set(0.58, 0.62, -0.25); engine.add(reservoir);
const bayFloor = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.02, 1.05), trim); bayFloor.position.set(0, 0.48, 0.02); engine.add(bayFloor);
const turbo = new THREE.Group(); turbo.position.set(0.2, 0.7, -0.24); engine.add(turbo);
const snail = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.038, 16, 40), turboMat); snail.rotation.y = Math.PI / 2; turbo.add(snail);
const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.09, 24), turboMat); housing.rotation.z = Math.PI / 2; housing.position.x = 0.07; turbo.add(housing);
const compressor = new THREE.Group(); compressor.position.x = 0.12; compressor.rotation.y = Math.PI / 2; turbo.add(compressor);
for (let i = 0; i < 7; i++) {
  const bl = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.05, 0.01), chrome); bl.rotation.z = i * Math.PI * 2 / 7; bl.translateY(0.027); compressor.add(bl);
}
const pipePath = new THREE.CatmullRomCurve3([new THREE.Vector3(0.33, 0.7, -0.24), new THREE.Vector3(0.45, 0.85, -0.05), new THREE.Vector3(0.45, 0.8, 0.3), new THREE.Vector3(0.3, 0.55, 0.45)]);
engine.add(new THREE.Mesh(new THREE.TubeGeometry(pipePath, 40, 0.032, 12), new THREE.MeshStandardMaterial({ color: 0x9b111e, roughness: 0.35, metalness: 0.3 })));
const turboLight = new THREE.PointLight(0xff5a1e, 0, 1.2, 2); turboLight.position.set(0.2, 0.85, -0.24); engine.add(turboLight);
engine.traverse(o => { if (o.isMesh) { o.userData.part = 'engine'; clickable.push(o); } });

// ---------- Interaction ----------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; controls.autoRotate = false; setPressed('bSpin', false); });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickable, false)[0];
  if (!hit) return;
  const p = hit.object.userData.part;
  if (p === 'engine') { setHood(true); setEngine(!running); }
  else toggle(p);
});

function setPressed(id, on) { document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false'); }
function toggle(name) { parts[name].open = !parts[name].open; syncButtons(); }
function setHood(on) { parts.hood.open = on; syncButtons(); }
const doorNames = ['doorLF', 'doorRF', 'doorLR', 'doorRR'];
function syncButtons() {
  setPressed('bHood', parts.hood.open);
  setPressed('bHatch', parts.hatch.open);
  setPressed('bDoors', doorNames.some(n => parts[n].open));
}
document.getElementById('bHood').onclick = () => toggle('hood');
document.getElementById('bHatch').onclick = () => toggle('hatch');
document.getElementById('bDoors').onclick = () => { const open = !doorNames.some(n => parts[n].open); doorNames.forEach(n => parts[n].open = open); syncButtons(); };
document.getElementById('bSpin').onclick = () => { controls.autoRotate = !controls.autoRotate; setPressed('bSpin', controls.autoRotate); };

// Engine simulation, or live rpm from the app.
let running = false, gas = false, rpm = 0, liveRpm = null;
const gasBtn = document.getElementById('gas');
function setEngine(on) {
  running = on; setPressed('bEngine', on);
  document.getElementById('bEngine').textContent = on ? 'Motoru durdur' : 'Motoru çalıştır';
  gasBtn.hidden = !on || liveRpm !== null;
}
document.getElementById('bEngine').onclick = () => { if (!running) setHood(true); setEngine(!running); };
gasBtn.addEventListener('pointerdown', e => { gas = true; gasBtn.setPointerCapture(e.pointerId); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) gasBtn.addEventListener(ev, () => { gas = false; });

// Bridge for the Android app: window.golf.setRpm(rpm) drives everything from the car.
window.golf = {
  setRpm(v) { liveRpm = v; if (!running && v > 300) setEngine(true); if (running && v < 100) setEngine(false); gasBtn.hidden = true; },
  openHood(on) { setHood(!!on); },
};

// ---------- Loop ----------
const rpmEl = document.getElementById('rpm');
const tagT = document.getElementById('tagTurbo'), tagE = document.getElementById('tagEngine'), boostEl = document.getElementById('boost');
const tmp = new THREE.Vector3();
function placeTag(el, obj, show) {
  obj.getWorldPosition(tmp); tmp.y += 0.18; tmp.project(camera);
  el.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px';
  el.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px';
  el.classList.toggle('on', show && tmp.z < 1);
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 58 : 36; camera.updateProjectionMatrix();
  // Keep the whole car in frame: distance from the horizontal field of view.
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  const fit = Math.max(5.4, 2.45 / Math.tan(hfov / 2));
  controls.minDistance = fit * 0.6; controls.maxDistance = fit * 1.6;
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, fit);
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let crank = 0, turboAngle = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const p of Object.values(parts)) {
    p.t += ((p.open ? 1 : 0) - p.t) * Math.min(1, 6 * dt);
    const ease = p.t * p.t * (3 - 2 * p.t);
    p.g.rotation[p.axis] = p.sign * p.max * ease;
  }
  let target = running ? (gas ? 6400 : 820) : 0;
  if (liveRpm !== null) target = liveRpm;
  rpm += (target - rpm) * Math.min(1, (gas ? 1.6 : 3) * dt);
  if (!running && liveRpm === null && rpm < 5) rpm = 0;
  const f = Math.min(1, rpm / 7000);
  crank += rpm / 60 * Math.PI * 2 * dt;
  turboAngle += rpm * dt * 0.08;
  compressor.rotation.z = turboAngle;
  const boost = Math.max(0, (rpm - 1500) / 4500 * 1.2);
  turboMat.emissiveIntensity = boost * 0.9;
  turboLight.intensity = boost * 3;
  // Engine rocks on its mounts and the body follows slightly.
  const shake = rpm > 0 ? Math.sin(crank * 2) * (0.0025 + f * 0.004) : 0;
  engine.position.y = shake; car.position.y = shake * 0.25;
  tailMat.emissiveIntensity = running ? 1.2 : 0.4;
  headMat.emissiveIntensity = running ? 1.4 : 0.6;
  ringMat.color.setRGB(0.89, 0.0 + f * 0.25, 0.1 * (1 - f));
  redFill.intensity = 6 + f * 14;
  rpmEl.textContent = Math.round(rpm / 10) * 10;
  rpmEl.classList.toggle('hot', rpm > 6000);
  document.getElementById('gas').style.setProperty('--p', (f * 100).toFixed(1) + '%');
  boostEl.textContent = boost.toFixed(1);
  const bayVisible = parts.hood.t > 0.6;
  placeTag(tagT, turbo, bayVisible);
  placeTag(tagE, cover, bayVisible && !running);
  controls.update();
  renderer.render(scene, camera);
});
</script>
