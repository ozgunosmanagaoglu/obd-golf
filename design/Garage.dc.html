<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Garaj · canlı motor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ff4d5e}a:hover{color:#ff8a95}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050608; color: #f4f5f7; font-family: Sora, system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: -80px; right: -80px; top: 120px; height: 360px; background: radial-gradient(50% 50% at 50% 55%, {{glow}} 0%, rgba(5,6,8,0) 70%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 844px; background: linear-gradient(180deg, rgba(5,6,8,0) 0%, rgba(5,6,8,0) 55%, #050608 80%)"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 844px; box-sizing: border-box; padding: 22px 22px 26px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; font-weight: 400; letter-spacing: 0.28em; color: #9a9ea6">GARAJ</span>
        <span style="font-size: 24px; font-weight: 300; letter-spacing: -0.01em">Golf <span style="font-weight: 600">VI</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08)">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: {{stateColor}}; box-shadow: 0 0 10px {{stateColor}}"></span>
        <span style="font-size: 12px; color: #d7d9de">{{stateLabel}}</span>
      </div>
    </div>

    <div style="position: relative; height: 250px; margin-top: 6px">
      <img src="/_blob/e8fda88b46742ac7dac03b913f262760" alt="Gri Golf Mk6, ön sol çapraz" style="position: absolute; left: -6px; top: 18px; width: 358px; height: auto; transform: translateY({{shake}}px)">
      <div style="position: absolute; left: 0; right: 0; top: 232px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.18), rgba(255,255,255,0))"></div>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 76px; font-weight: 200; line-height: 0.9; letter-spacing: -0.04em; color: {{rpmColor}}">{{rpmText}}</span>
        <span style="font-size: 11px; letter-spacing: 0.28em; color: #9a9ea6; margin-top: 6px">DEVİR / DK</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 40px; font-weight: 300; line-height: 1; letter-spacing: -0.03em">{{speed}}</span>
        <span style="font-size: 11px; letter-spacing: 0.28em; color: #9a9ea6; margin-top: 6px">KM/H · {{gear}}</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(28, minmax(0, 1fr)); gap: 3px; margin-top: 16px; height: 14px">
      <sc-for list="{{leds}}" as="l" hint-placeholder-count="28">
        <div style="height: 14px; border-radius: 3px; background: {{l.c}}; box-shadow: {{l.s}}"></div>
      </sc-for>
    </div>

    <div style="margin-top: 18px; padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 11px; letter-spacing: 0.22em; color: #9a9ea6">MOTOR · 1.4 TSI</span>
        <span style="font-size: 11px; letter-spacing: 0.12em; color: #9a9ea6">ATEŞLEME 1-3-4-2</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; flex-grow: 1; height: 112px">
          <sc-for list="{{cyl}}" as="c" hint-placeholder-count="4">
            <div style="position: relative; height: 112px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.08); overflow: hidden">
              <div style="position: absolute; left: 0; right: 0; top: 0; height: 60px; background: radial-gradient(70% 80% at 50% 0%, {{c.fire}} 0%, rgba(0,0,0,0) 100%)"></div>
              <div style="position: absolute; left: 9px; right: 9px; top: {{c.top}}px; height: 26px; border-radius: 9px; background: linear-gradient(180deg, #f1f3f6, #8d939b); box-shadow: 0 -6px 18px {{c.fire}}"></div>
              <span style="position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 10px; color: #6f747c">{{c.n}}</span>
            </div>
          </sc-for>
        </div>
        <div style="position: relative; width: 92px; height: 92px; flex-shrink: 0">
          <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true" style="position: absolute; left: 0; top: 0">
            <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"></circle>
            <circle cx="46" cy="46" r="40" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="{{boostDash}} 100" transform="rotate(-90 46 46)"></circle>
            <g transform="rotate({{turboDeg}} 46 46)" opacity="0.9">
              <path d="M46 46 Q52 26 46 18" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M46 46 Q66 52 74 46" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M46 46 Q40 66 46 74" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M46 46 Q26 40 18 46" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M46 46 Q61 31 66 26" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <path d="M46 46 Q31 61 26 66" stroke="#c9ced4" stroke-width="2" fill="none" stroke-linecap="round"></path>
            </g>
          </svg>
          <div style="position: absolute; left: 0; right: 0; top: 34px; display: flex; flex-direction: column; align-items: center">
            <span style="font-size: 16px; font-weight: 600; line-height: 1">{{boostText}}</span>
            <span style="font-size: 9px; letter-spacing: 0.18em; color: #9a9ea6; margin-top: 3px">BAR</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
      <div style="padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 10px; letter-spacing: 0.18em; color: #9a9ea6">SU</span>
        <span style="font-size: 20px; font-weight: 300">{{coolant}}<span style="font-size: 12px; color: #9a9ea6"> °C</span></span>
      </div>
      <div style="padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 10px; letter-spacing: 0.18em; color: #9a9ea6">YÜK</span>
        <span style="font-size: 20px; font-weight: 300">{{load}}<span style="font-size: 12px; color: #9a9ea6"> %</span></span>
      </div>
      <div style="padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 10px; letter-spacing: 0.18em; color: #9a9ea6">AKÜ</span>
        <span style="font-size: 20px; font-weight: 300">14.2<span style="font-size: 12px; color: #9a9ea6"> V</span></span>
      </div>
    </div>

    <div style="flex-grow: 1"></div>

    <button type="button" onPointerDown="{{press}}" onPointerUp="{{release}}" onPointerLeave="{{release}}" style="position: relative; height: 62px; border: 1px solid rgba(255,255,255,0.12); border-radius: 31px; background: linear-gradient(90deg, {{accent}} 0%, {{accent}} {{rpmPct}}%, rgba(255,255,255,0.05) {{rpmPct}}%); color: #ffffff; font: 600 14px Sora, sans-serif; letter-spacing: 0.24em; cursor: pointer; touch-action: none; box-shadow: 0 10px 40px {{btnGlow}}">BASILI TUT · GAZ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e3001b","options":["#e3001b","#ff2d55","#b5121b"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { rpm: 800, crank: 0, turbo: 0, gas: false };
this.last = 0;
}
componentDidMount() {
const step = (t) => {
const dt = this.last ? Math.min((t - this.last) / 1000, 0.05) : 0.016;
this.last = t;
const s = this.state;
const target = s.gas ? 6400 : 800;
const k = s.gas ? 1.4 : 2.2;
const rpm = s.rpm + (target - s.rpm) * Math.min(1, k * dt);
// Pistons shown slowed down so the eye can follow them.
const crank = (s.crank + rpm / 60 * 360 * dt / 40) % 720;
const turbo = (s.turbo + rpm * dt * 0.5) % 360;
this.setState({ rpm, crank, turbo });
this.raf = requestAnimationFrame(step);
};
this.raf = requestAnimationFrame(step);
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
renderVals() {
const s = this.state;
const accent = this.props.accent ?? '#e3001b';
const rad = (d) => d * Math.PI / 180;
const f = Math.min(1, s.rpm / 7000);
const phase = [0, 180, 180, 0];
const fireAt = [0, 540, 180, 360];
const cyl = [1, 2, 3, 4].map((n, i) => {
const y = (1 - Math.cos(rad(s.crank + phase[i]))) / 2;
const since = ((s.crank - fireAt[i]) % 720 + 720) % 720;
const glow = since < 100 ? 1 - since / 100 : 0;
return { n: n, top: Math.round(10 + y * 54), fire: 'rgba(255,90,40,' + (glow * 0.9).toFixed(2) + ')' };
});
const lit = Math.round(f * 28);
const leds = Array.from({ length: 28 }, (_, i) => {
const on = i < lit;
const col = i >= 24 ? '#ff2d3d' : (i >= 18 ? '#ffb020' : '#f4f5f7');
return { c: on ? col : 'rgba(255,255,255,0.07)', s: on ? '0 0 10px ' + col : 'none' };
});
const speed = Math.max(0, (s.rpm - 800) / 5600) * 140;
const red = s.rpm > 6000;
const boost = Math.max(0, (s.rpm - 1500) / 4500 * 1.2);
return {
accent: accent,
cyl: cyl,
leds: leds,
rpmText: Math.round(s.rpm / 10) * 10,
rpmPct: (f * 100).toFixed(1),
rpmColor: red ? '#ff4d5e' : '#f4f5f7',
speed: Math.round(speed),
gear: s.rpm < 1000 ? 'N' : 'D' + Math.min(7, 1 + Math.floor(speed / 22)),
turboDeg: s.turbo.toFixed(1),
boostText: boost.toFixed(1),
boostDash: (boost / 1.4 * 100).toFixed(1),
coolant: 90,
load: Math.round(Math.min(100, 14 + (s.gas ? 68 : 0) + f * 18)),
glow: 'rgba(227,0,27,' + (0.18 + f * 0.4).toFixed(2) + ')',
btnGlow: 'rgba(227,0,27,' + (0.15 + f * 0.45).toFixed(2) + ')',
shake: (Math.sin(s.crank * Math.PI / 45) * (0.3 + f)).toFixed(2),
stateLabel: s.rpm < 1000 ? 'Rölanti' : (red ? 'Kırmızı bölge' : 'Gaz'),
stateColor: red ? '#ff4d5e' : '#3ddc84',
press: () => this.setState({ gas: true }),
release: () => this.setState({ gas: false }),
};
}
}
</script>
</body>
</html>
