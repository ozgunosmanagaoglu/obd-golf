<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0d0e10; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">

      <div style="width: 36px; height: 36px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #ffffff">G6</div>

    </div>
    <a href="Connect.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; background: #1a1c20; text-decoration: none; color: #f2f2f3; font-size: 13px">

    <div style="position: absolute; left: 0; right: 0; top: 78px; display: flex; flex-direction: column; align-items: center; gap: 2px">

      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px">14.2<span style="font-size: 16px; color: #a3a5ab"> V</span></span>

      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px">38<span style="font-size: 16px; color: #a3a5ab"> %</span></span>

  </div>

  <div style="flex-grow: 1"></div>

  <nav style="display: flex; gap: 8px; background: #17191d; border-radius: 22px; padding: 6px">

    <a href="Connect.dc.html" style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 16px; color: #d6d7da; text-decoration: none; font-size: 14px">Bağlantı</a>
  </nav>
